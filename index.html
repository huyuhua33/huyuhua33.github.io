<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>巴哈伊經典卡｜抽卡與反思提問</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="抽一張經典卡或反思提問，在片刻安靜中閱讀、思考與行動。" />
  <meta name="theme-color" content="#03A6A6" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cards.siganmorfu.com/" />
  <meta property="og:title" content="經典卡抽卡｜抽一張卡，留一個問題給自己" />
  <meta property="og:description" content="抽一張經典卡或反思提問，在片刻安靜中閱讀、思考與行動。" />
  <meta property="og:image" content="https://cards.siganmorfu.com/og.png" />
  <meta property="og:image:alt" content="經典卡抽卡與反思提問的卡牌插畫" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="經典卡抽卡｜抽一張卡，留一個問題給自己" />
  <meta name="twitter:description" content="抽一張經典卡或反思提問，在片刻安靜中閱讀、思考與行動。" />
  <meta name="twitter:image" content="https://cards.siganmorfu.com/og.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>經典卡抽卡</h1>

      <div class="theme-switch-container">
        <span class="mode-label">淺色</span>
        <label class="switch">
          <input type="checkbox" id="themeToggleCheckbox">
          <span class="slider round"></span>
        </label>
        <span class="mode-label">深色</span>
      </div>
      
      <div class="segmented-control-wrapper">
        <div class="segmented-control">
          <input type="radio" name="mode" id="mode-simple" value="simple" checked>
          <label for="mode-simple">簡單版</label>

          <input type="radio" name="mode" id="mode-divination" value="divination">
          <label for="mode-divination">占卜版</label>

          <input type="radio" name="mode" id="mode-hiddenzh" value="hiddenzh">
          <label for="mode-hiddenzh">隱言經 (中)</label>
          
          <input type="radio" name="mode" id="mode-hiddenen" value="hiddenen">
          <label for="mode-hiddenen">隱言經 (英)</label>

          <input type="radio" name="mode" id="mode-questions" value="questions">
          <label for="mode-questions">反思提問</label>
        </div>
      </div>
    </header>

    <main class="app-main">
      
      <section id="divinationModeDisplay" style="display: none;">
        <div class="selection-counter" id="selectionCounter">請憑直覺挑選 6 張卡片</div>
        <div id="cardSpread" class="full-deck-grid"></div>
        
        <div id="testCardDetail" class="test-card-detail">
          <p>準備中...</p>
        </div>

        <div id="divinationFullResults" class="divination-full-results" style="display: none;">
          <h3>✦ 您的占卜結果 ✦</h3>
          <div id="resultsContainer"></div>
          <button class="btn secondary" style="margin-top: 20px; width: 100%;" onclick="renderFullDeck()">重新挑選</button>
        </div>
      </section>
      
      <div id="simpleModeGroup">
        <section class="deck-section">
          <div id="deck" class="deck-stack">
            <img src="./imgs/Back.png" alt="卡牌背面" />
          </div>
        </section>

        <details class="cardlist" id="cardListPanel">
          <summary>卡牌清單</summary>
          <div id="cardList" class="cardlist-body"></div>
        </details>

        <section class="card-display" id="cardDisplay">
          <div class="card-inner">
            <div class="card-image-wrapper" id="cardImageWrapper">
              <img id="cardImage" alt="卡牌圖片" />
            </div>
            <h2 id="cardName" class="card-name">請抽經典卡</h2>
            <p id="cardDescription" class="card-description">
              點擊上方卡組或下方按鈕抽卡。
            </p>
          </div>
        </section>

        <section class="controls">
          <button id="drawButton" class="btn primary" disabled>
            抽卡
          </button>
        </section>
      </div>

      <div id="textOnlyModeGroup" style="display: none;">
        <section class="deck-section">
          <div id="deckTextOnly" class="deck-stack">
            <img src="./imgs/Back.png" alt="卡牌背面" />
          </div>
        </section>

        <section class="card-display">
          <div class="card-inner">
            <h2 id="textCardName" class="card-name">請抽隱言經</h2>
            <p id="textCardDescription" class="card-description">
              點擊上方卡組或下方按鈕抽卡。
            </p>
          </div>
        </section>

        <section class="controls">
          <button id="drawButtonTextOnly" class="btn primary">
            抽卡
          </button>
        </section>
      </div>

      <div id="questionModeGroup" style="display: none;">
        <section class="deck-section">
          <div id="deckQuestion" class="deck-stack" role="button" tabindex="0" aria-label="抽一個反思問題">
            <img src="./imgs/Back.png" alt="反思提問卡背面" />
          </div>
        </section>

        <section class="card-display" id="questionCardDisplay">
          <div class="card-inner" id="questionCardInner" aria-live="polite" aria-atomic="true">
            <span id="questionCategory" class="question-category" hidden></span>
            <h2 class="card-name">給自己一點思考的空間</h2>
            <p id="questionText" class="question-text">
              點擊上方卡組或下方按鈕，抽一個此刻值得思考的問題。
            </p>
            <p id="questionResource" class="question-resource" hidden></p>
            <p class="question-note">不急著找到答案，先留意心裡浮現了什麼。</p>
          </div>
        </section>

        <section class="controls">
          <button id="drawQuestionButton" class="btn primary" disabled>
            抽問題
          </button>
        </section>

        <section class="question-search" aria-labelledby="questionSearchTitle">
          <h2 id="questionSearchTitle">搜尋問題</h2>
          <label class="search-label" for="questionSearchInput">依主題、來源或關鍵字尋找</label>
          <input
            id="questionSearchInput"
            class="search-input"
            type="search"
            inputmode="search"
            placeholder="例如：服務、社區、B13"
            autocomplete="off"
            disabled
          />
          <p id="questionSearchStatus" class="search-status" aria-live="polite"></p>
          <div id="questionSearchResults" class="question-results"></div>
        </section>
      </div>
      
      <section class="status" id="mainStatusSection">
        <p id="statusText">正在初始化...</p>
        <label class="toggle" id="imageToggleContainer">
          <input type="checkbox" id="toggleImage" checked />
          <span>顯示卡牌圖片（若有）</span>
        </label>
      </section>
      
    </main>

    <footer class="app-footer">
      <small>本頁不會儲存任何個人資料，僅做卡牌內容顯示、抽卡與提問搜尋互動。</small>
      <br />
      <small>Provide by Siganmorfu, Cycle , Masa and Shoghi</small>
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
